server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # React router — serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to backend service
    location /api/ {
        proxy_pass http://backend-service:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Spring Security OAuth2 initiation endpoint (e.g. /oauth2/authorization/google).
    # Note: /oauth2/callback is a React route and must NOT be proxied — it falls through
    # to the location / block above because it doesn't match this longer prefix.
    location /oauth2/authorization/ {
        proxy_pass http://backend-service:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Google's redirect back to Spring (/login/oauth2/code/google)
    location /login/oauth2/ {
        proxy_pass http://backend-service:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }
}
