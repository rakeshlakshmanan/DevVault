name: CD

on:
  push:
    branches: [main]
  workflow_dispatch: # manual trigger still available

concurrency:
  group: cd
  cancel-in-progress: false

env:
  PROJECT_ID: devvault-oct
  REGION: us-central1
  REGISTRY: us-central1-docker.pkg.dev/devvault-oct/devvault
  CLUSTER: devvault-cluster

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        env:
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          missing=0
          for name in DB_USERNAME DB_PASSWORD JWT_SECRET; do
            if [ -z "${!name}" ]; then echo "::error::Missing GitHub secret $name"; missing=1; fi
          done
          exit $missing

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: gke-gcloud-auth-plugin

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build & push backend
        run: |
          docker build -t ${{ env.REGISTRY }}/backend:${{ github.sha }} \
                       -t ${{ env.REGISTRY }}/backend:latest \
                       ./backend
          docker push ${{ env.REGISTRY }}/backend:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/backend:latest

      - name: Build & push frontend
        run: |
          docker build -t ${{ env.REGISTRY }}/frontend:${{ github.sha }} \
                       -t ${{ env.REGISTRY }}/frontend:latest \
                       ./frontend
          docker push ${{ env.REGISTRY }}/frontend:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/frontend:latest

      - name: Get GKE credentials
        env:
          USE_GKE_GCLOUD_AUTH_PLUGIN: "True"
        run: |
          gcloud container clusters get-credentials ${{ env.CLUSTER }} \
            --location ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }}

      - name: Deploy to GKE
        env:
          USE_GKE_GCLOUD_AUTH_PLUGIN: "True"
        run: |
          kubectl apply -f k8s/namespace.yml

          kubectl create secret generic devvault-secrets \
            --namespace=devvault \
            --from-literal=DB_USERNAME="${{ secrets.DB_USERNAME }}" \
            --from-literal=DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
            --from-literal=JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            --from-literal=GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}" \
            --from-literal=GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}" \
            --from-literal=GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl apply -f k8s/postgres.yml
          # Autopilot may need to provision a node for the first pod, which can
          # exceed 2 minutes on a cold cluster — give the rollout room.
          kubectl rollout status deployment/postgres -n devvault --timeout=600s

          kubectl apply -f k8s/backend.yml
          kubectl apply -f k8s/frontend.yml
          kubectl apply -f k8s/ingress.yml
          kubectl set image deployment/backend backend=${{ env.REGISTRY }}/backend:${{ github.sha }} -n devvault
          kubectl set image deployment/frontend frontend=${{ env.REGISTRY }}/frontend:${{ github.sha }} -n devvault
          kubectl rollout status deployment/backend -n devvault --timeout=300s
          kubectl rollout status deployment/frontend -n devvault --timeout=300s
